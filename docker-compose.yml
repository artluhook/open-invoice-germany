# Open Invoice Germany — Production docker-compose.yml
# Generated: 2026-08-17 by Orangepi
# All data in /home/oig, Docker images in default location.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oig
      POSTGRES_DB: openinvoice
      POSTGRES_PASSWORD: ${PG_PASS:-changeme}
    volumes:
      - oig-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oig -d openinvoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://oig:${PG_PASS}@db:5432/openinvoice?schema=public"
    ports:
      - "3000:3000"
    volumes:
      - /home/oig/data:/app/data

volumes:
  oig-db:
